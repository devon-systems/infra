name: check-tofu
"on":
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch: {}
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: read
env:
  NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"
jobs:
  check-tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Validate OpenTofu configuration
        run: >-
          nix shell --accept-flake-config --inputs-from . nixpkgs#opentofu -c bash -c
          'tofu -chdir=terraform init -backend=false -input=false -lockfile=readonly 
          && tofu -chdir=terraform fmt -check -recursive
          && tofu -chdir=terraform validate'
